name: Bug Report
description: Report a bug in BitSage Validator
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill out the information below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: dropdown
    id: network
    attributes:
      label: Network
      options:
        - Sepolia (Testnet)
        - Mainnet
        - Devnet
    validations:
      required: true

  - type: input
    id: wallet
    attributes:
      label: Wallet
      description: Which wallet are you using?
      placeholder: e.g., ArgentX, Braavos

  - type: input
    id: browser
    attributes:
      label: Browser & OS
      placeholder: e.g., Chrome 120 on macOS

  - type: textarea
    id: logs
    attributes:
      label: Console Logs
      description: Paste any relevant console errors.
      render: shell
