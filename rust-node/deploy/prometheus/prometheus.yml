# Prometheus Configuration for BitSage
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'bitsage-production'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Rule files
rule_files:
  - /etc/prometheus/alerts.yml

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # BitSage Coordinator
  - job_name: 'bitsage-coordinator'
    static_configs:
      - targets: ['coordinator:9090']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'coordinator'

  # Traefik metrics
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']

  # PostgreSQL exporter (if added)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'postgres'

  # Redis exporter (if added)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'redis'

  # GPU Workers (dynamic discovery via file_sd)
  - job_name: 'gpu-workers'
    file_sd_configs:
      - files:
          - /etc/prometheus/workers/*.json
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [gpu_model]
        target_label: gpu_model
