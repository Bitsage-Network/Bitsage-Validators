# Promtail Configuration for BitSage
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs
  - job_name: containers
    static_configs:
      - targets:
          - localhost
        labels:
          job: containerlogs
          __path__: /var/lib/docker/containers/*/*log

    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            attrs:
      - json:
          expressions:
            tag:
          source: attrs
      - regex:
          expression: (?P<container_name>(?:[a-z0-9][a-z0-9_.-]*))
          source: tag
      - timestamp:
          source: time
          format: RFC3339Nano
      - labels:
          stream:
          container_name:
      - output:
          source: output

  # Traefik access logs
  - job_name: traefik
    static_configs:
      - targets:
          - localhost
        labels:
          job: traefik
          __path__: /var/log/traefik/*.log

    pipeline_stages:
      - json:
          expressions:
            time: time
            status: OriginStatus
            method: RequestMethod
            path: RequestPath
            duration: Duration
            client: ClientAddr
      - labels:
          status:
          method:
      - timestamp:
          source: time
          format: RFC3339Nano

  # BitSage Coordinator logs (JSON format in production)
  - job_name: bitsage-coordinator
    static_configs:
      - targets:
          - localhost
        labels:
          job: bitsage
          service: coordinator
          __path__: /var/log/bitsage/*.log

    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            target: target
            timestamp: timestamp
      - labels:
          level:
          target:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
