# Grafana Dashboard Provisioning
apiVersion: 1

providers:
  - name: 'BitSage Dashboards'
    orgId: 1
    folder: 'BitSage'
    folderUid: 'bitsage'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
